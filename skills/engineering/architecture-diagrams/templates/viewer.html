<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__TITLE__</title>
    <meta name="generator" content="architecture-diagrams skill" />
    <meta name="description" content="__DESCRIPTION__" />
    <style>
__CSS__
    </style>
  </head>
  <body>
    <header>
      <span class="kind">__KIND__</span>
      <h1>__TITLE__</h1>
      <p class="sub">__SUBTITLE__</p>
      <div class="tools">
        <input
          type="search"
          id="find"
          placeholder="Filter nodes"
          aria-label="Filter nodes by name"
        />
        <button id="theme" type="button" aria-pressed="false">Light</button>
        <button id="fit" type="button">Fit</button>
      </div>
    </header>

    <main class="stage" id="stage">
      <svg
        id="svg"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-labelledby="svgtitle svgdesc"
      >
        <title id="svgtitle">__TITLE__</title>
        <desc id="svgdesc">__A11Y_DESC__</desc>
        <defs>
          <marker
            id="arrow"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="7"
            markerHeight="7"
            orient="auto-start-reverse"
          >
            <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke" />
          </marker>
        </defs>
        <g id="viewport">
__BODY__
        </g>
      </svg>
    </main>

    <footer>
      <div class="legend">__LEGEND__</div>
      <div class="spacer"></div>
      <span
        >Drag to pan, scroll to zoom, click a node to isolate it,
        <kbd>Esc</kbd> to clear</span
      >
      <span id="footer">__FOOTER__</span>
      <span id="stat">__STAT__</span>
    </footer>

    <!--
      No dependencies and no network. Everything below is plain DOM work against
      the inline SVG above, so this file behaves identically from a file:// path,
      an intranet share, or a CI artifact download, today or in five years.
    -->
    <script>
      (function () {
        "use strict";

        var svg = document.getElementById("svg");
        var viewport = document.getElementById("viewport");
        var stage = document.getElementById("stage");

        // Honour the reader's motion preference for the pan/zoom easing.
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          document.documentElement.classList.add("no-motion");
        }

        // ------------------------------------------------------------- theme
        var themeBtn = document.getElementById("theme");
        var stored = null;
        try {
          stored = localStorage.getItem("diagram-theme");
        } catch (e) {
          // Private mode or a file:// origin with storage blocked. Not fatal.
        }
        var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
        setTheme(stored || (prefersLight ? "light" : "dark"));

        function setTheme(name) {
          document.documentElement.setAttribute("data-theme", name);
          themeBtn.textContent = name === "dark" ? "Light" : "Dark";
          themeBtn.setAttribute("aria-pressed", name === "light" ? "true" : "false");
          try {
            localStorage.setItem("diagram-theme", name);
          } catch (e) {}
        }

        themeBtn.addEventListener("click", function () {
          setTheme(
            document.documentElement.getAttribute("data-theme") === "dark"
              ? "light"
              : "dark"
          );
        });

        // -------------------------------------------------------- pan + zoom
        var box = { x: __MIN_X__, y: __MIN_Y__, w: __WIDTH__, h: __HEIGHT__ };
        var view = { x: 0, y: 0, k: 1 };

        function apply() {
          viewport.setAttribute(
            "transform",
            "translate(" + view.x + "," + view.y + ") scale(" + view.k + ")"
          );
        }

        function fit() {
          var r = stage.getBoundingClientRect();
          svg.setAttribute("viewBox", box.x + " " + box.y + " " + box.w + " " + box.h);
          svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
          // The viewBox already scales to fit, so the transform starts neutral.
          view = { x: 0, y: 0, k: 1 };
          apply();
          return r;
        }
        fit();
        document.getElementById("fit").addEventListener("click", fit);
        window.addEventListener("resize", fit);

        stage.addEventListener(
          "wheel",
          function (e) {
            e.preventDefault();
            // Zoom about the pointer so the thing under the cursor stays put.
            var rect = stage.getBoundingClientRect();
            var px = e.clientX - rect.left;
            var py = e.clientY - rect.top;
            var factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
            var next = Math.min(8, Math.max(0.15, view.k * factor));
            var ratio = next / view.k;
            view.x = px - (px - view.x) * ratio;
            view.y = py - (py - view.y) * ratio;
            view.k = next;
            apply();
          },
          { passive: false }
        );

        var drag = null;
        stage.addEventListener("pointerdown", function (e) {
          if (e.target.closest(".node")) return; // let the click select instead
          drag = { x: e.clientX - view.x, y: e.clientY - view.y };
          stage.classList.add("dragging");
          stage.setPointerCapture(e.pointerId);
        });
        stage.addEventListener("pointermove", function (e) {
          if (!drag) return;
          view.x = e.clientX - drag.x;
          view.y = e.clientY - drag.y;
          apply();
        });
        function endDrag() {
          drag = null;
          stage.classList.remove("dragging");
        }
        stage.addEventListener("pointerup", endDrag);
        stage.addEventListener("pointercancel", endDrag);

        // ---------------------------------------------------------- focus
        // Clicking a node isolates it and everything one hop away, which is the
        // question a reader actually has: what talks to this thing?
        var edges = [].slice.call(document.querySelectorAll(".edge, .msg"));
        var nodes = [].slice.call(document.querySelectorAll(".node"));

        function clearFocus() {
          svg.classList.remove("focused");
          nodes.concat(edges).forEach(function (el) {
            el.classList.remove("on");
          });
        }

        function focus(id) {
          var neighbours = {};
          neighbours[id] = true;
          edges.forEach(function (edge) {
            var a = edge.getAttribute("data-from");
            var b = edge.getAttribute("data-to");
            if (a === id || b === id) {
              edge.classList.add("on");
              neighbours[a] = true;
              neighbours[b] = true;
            } else {
              edge.classList.remove("on");
            }
          });
          nodes.forEach(function (node) {
            node.classList.toggle("on", !!neighbours[node.getAttribute("data-id")]);
          });
          svg.classList.add("focused");
        }

        nodes.forEach(function (node) {
          node.addEventListener("click", function (e) {
            e.stopPropagation();
            var id = node.getAttribute("data-id");
            if (svg.classList.contains("focused") && node.classList.contains("on")) {
              clearFocus();
            } else {
              focus(id);
            }
          });
          node.addEventListener("keydown", function (e) {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              node.dispatchEvent(new MouseEvent("click", { bubbles: true }));
            }
          });
        });

        stage.addEventListener("click", function (e) {
          if (!e.target.closest(".node")) clearFocus();
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") {
            clearFocus();
            var find = document.getElementById("find");
            find.value = "";
            filter("");
          }
        });

        // ---------------------------------------------------------- filter
        var findInput = document.getElementById("find");
        function filter(term) {
          var q = term.trim().toLowerCase();
          nodes.forEach(function (node) {
            var hay = (node.getAttribute("data-search") || "").toLowerCase();
            node.classList.toggle("hidden", q !== "" && hay.indexOf(q) === -1);
          });
        }
        findInput.addEventListener("input", function () {
          filter(findInput.value);
        });
      })();
    </script>
  </body>
</html>
