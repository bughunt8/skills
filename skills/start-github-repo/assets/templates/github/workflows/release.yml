name: Release

on:
  push:
    branches: [{{DEFAULT_BRANCH}}]

permissions:
  contents: read

concurrency:
  group: release-{{DEFAULT_BRANCH}}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write        # create the version PR, tags and releases
      pull-requests: write   # open and update the version PR
      id-token: write        # OIDC — prefer this over a long-lived publish token
      attestations: write    # SLSA provenance for published artifacts
    steps:
      - uses: actions/checkout@v4 # SCAFFOLD-PIN-SHA
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4 # SCAFFOLD-PIN-SHA
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: {{PACKAGE_MANAGER}} install --frozen-lockfile
      - run: {{BUILD_COMMAND}}

      - name: Version or publish
        uses: changesets/action@v1 # SCAFFOLD-PIN-SHA
        with:
          version: {{PACKAGE_MANAGER}} run version
          publish: {{PACKAGE_MANAGER}} run release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2 # SCAFFOLD-PIN-SHA
        with:
          subject-path: dist/**
