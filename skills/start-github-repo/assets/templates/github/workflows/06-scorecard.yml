name: OpenSSF Scorecard

# Public repositories only. Publishing results requires the repository to be public.
on:
  branch_protection_rule:
  schedule:
    - cron: "0 7 * * 2"
  push:
    branches: [{{DEFAULT_BRANCH}}]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v4 # SCAFFOLD-PIN-SHA
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2 # SCAFFOLD-PIN-SHA
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v3 # SCAFFOLD-PIN-SHA
        with:
          sarif_file: results.sarif
