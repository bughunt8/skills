name: Site validate

# Every gate that decides whether the skill-browser site is fit to publish.
# Defined once and called by site-ci.yml and site-deploy-production.yml, so a
# production deploy validates the exact commit it is about to ship rather than
# trusting that some earlier run passed.
#
# The site lives in site/ and is generated from this repository's own skills/
# directory, so a change under skills/ can make the committed page stale. That is
# why site-ci.yml watches skills/** as well as site/**.
#
# Uses no secrets and is read-only against the repository, so the full suite runs
# on fork pull requests.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      # Our own rule: nothing credential-shaped may enter the tree. This repo
      # deploys over FTP, so it is exactly the repository where a password gets
      # pasted "just to test it".
      - name: Scan the tree for credential-shaped material
        run: node scripts/check-secrets.mjs

      - name: Scan the full history with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: build is reproducible from source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # index.html is generated from the repositories pinned in sources.json. If
      # the committed page disagrees with those pins, the counts on screen are a
      # claim nobody checked, so the build fails rather than shipping it.
      - name: Verify index.html matches the pinned sources
        run: python3 build.py --check

      - name: Confirm the gate can actually fail
        run: |
          # Guard against --check passing vacuously. Plant a card that is in no
          # source repo, prove --check rejects it, restore, prove it passes.
          cp index.html /tmp/index.orig
          sed -i 's#</main>#<article class="card"><h3>planted-defect</h3></article></main>#' index.html
          if python3 build.py --check; then
            echo "::error::build.py --check passed on a corrupted index.html; the gate is vacuous"
            cp /tmp/index.orig index.html
            exit 1
          fi
          echo "gate confirmed: --check rejects a page that disagrees with its sources"
          cp /tmp/index.orig index.html
          python3 build.py --check

      - name: Confirm the count audit can actually fail
        run: |
          # Same again for the claim audit: type a false count into the
          # hand-written region and prove the build refuses it.
          cp index.html /tmp/index.orig
          sed -i '0,/<title>/s#<title>[^<]*#<title>The Skill Library, 999 agent skills across 3 categories#' index.html
          if python3 build.py --check; then
            echo "::error::audit_claims passed on a false count; the gate is vacuous"
            cp /tmp/index.orig index.html
            exit 1
          fi
          echo "gate confirmed: a hand-typed count fails the build"
          cp /tmp/index.orig index.html
          python3 build.py --check

  lint:
    name: html validity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint:html

  test:
    name: browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      # Content, motion, resilience and accessibility. The suite asserts the page
      # renders with JavaScript disabled, degrades to a complete list under
      # prefers-reduced-motion, survives the motion CDN being unreachable, and has
      # no horizontal overflow at any of eight widths in both motion modes.
      - name: Run the suite
        run: npm test

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 14

  solutions:
    name: solution references resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # check_solutions.py needs PyYAML; it runs from the repo root, not site/.
      - name: Install PyYAML
        run: python3 -m pip install --quiet 'PyYAML==6.0.2'

      # A Solution Skill references skills by name. A renamed or removed skill
      # must not leave a solution pointing at nothing, and an ambiguous name must
      # not pick the wrong skill. This gate blocks both.
      - name: Validate solution steps resolve to real skills
        run: python3 scripts/check_solutions.py

      # The browser tests could not see the two worst defects this engine has had.
      # They counted lead nodes against Solution cards and matched name strings, so
      # they passed while the graph drew one node for two different skills and
      # terminated an edge on an unrelated skill of the same name. These assertions
      # are about identity and topology, made against the engine, not the DOM.
      - name: Unit-test the composition engine
        working-directory: site
        run: python3 tests/test_compose.py

      # The browser can see whether the graph renders. It cannot see whether no two of
      # 490 nodes are drawn on top of each other, whether the communities are the ones
      # the next build will find, or whether the shortest route between two skills is
      # actually the shortest. Four openings were written for this page and the browser
      # suite passed on all of them.
      - name: Unit-test the graph, its communities and its geometry
        working-directory: site
        run: python3 tests/test_network.py

      # Each planted defect below was actually written and actually shipped. If the tests
      # pass with one planted, the matching assertion is decorative.
      - name: Confirm the graph tests can actually fail
        working-directory: site
        run: |
          for defect in spacing labels seed; do
            python3 scripts/plant_network_defect.py plant "$defect"
            if python3 tests/test_network.py > "/tmp/planted-$defect.log" 2>&1; then
              echo "::error::the graph tests passed with the '$defect' defect planted"
              python3 scripts/plant_network_defect.py restore
              exit 1
            fi
            echo "gate confirmed: '$defect' fails these tests"
            grep -E "^  FAIL" "/tmp/planted-$defect.log" | head -3 || true
            python3 scripts/plant_network_defect.py restore
          done
          python3 tests/test_network.py

      - name: Confirm the composition tests can actually fail
        working-directory: site
        run: |
          python3 scripts/plant_identity_defect.py plant
          if python3 tests/test_compose.py > /tmp/planted.log 2>&1; then
            echo "::error::the composition tests passed with the identity defect planted"
            python3 scripts/plant_identity_defect.py restore
            exit 1
          fi
          echo "gate confirmed: name-keying the graph fails these tests"
          grep -E "^  FAIL" /tmp/planted.log || true
          python3 scripts/plant_identity_defect.py restore
          python3 tests/test_compose.py

  gate:
    name: all gates passed
    runs-on: ubuntu-latest
    needs: [secrets, build, lint, test, solutions]
    if: always()
    steps:
      - name: Fail if any gate failed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "upstream results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::a required gate did not pass ($results)"
              exit 1
            fi
          done
          echo "all gates passed"
