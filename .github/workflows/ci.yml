name: ci

# A skills library has no build and no runtime, so its correctness lives entirely
# in metadata and provenance. That is what this workflow tests.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate skills and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # SK001-SK008. Pre-existing violations are recorded in
      # scripts/skill_lint_baseline.json so this gate blocks new debt without
      # requiring the whole backlog to be fixed first.
      - name: Lint every SKILL.md
        run: python3 scripts/lint_skills.py

      # The README used to carry hand-counted totals; three of them were wrong.
      # The counts are generated now, and this step proves nobody bypassed it.
      - name: Check the generated skill index is current
        run: python3 scripts/generate_index.py --check

      # Offline: every vendored directory still has provenance, a licence copy,
      # an attribution file, no excluded skill smuggled back in, and every
      # mandatory import still present. No network, so upstream moving does not
      # turn unrelated pull requests red.
      - name: Validate vendored provenance
        run: python3 scripts/sync_vendor.py --validate-manifest

      - name: Show the full unbaselined backlog for information
        if: always()
        run: python3 scripts/lint_skills.py --strict || true
