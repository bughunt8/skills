name: S3 site verify live (reusable)

# One read-only verifier for normal deployments and isolated failure proofs.
# No upload credentials, environment approval, bypass flag or optional skip.
on:
  workflow_call:
    inputs:
      url:
        description: "HTTPS origin that must serve the expected revision"
        required: true
        type: string
      expected_sha:
        description: "Full commit SHA expected in BUILD-INFO.txt"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: smoke-test the live revision
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Validate verification inputs
        env:
          SITE_URL: ${{ inputs.url }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const url = new URL(process.env.SITE_URL);
          assert.equal(url.protocol, 'https:', 'verification requires HTTPS');
          assert(!url.username && !url.password, 'credentials cannot be part of the URL');
          assert.match(process.env.EXPECTED_SHA, /^[0-9a-f]{40}$/, 'a full commit SHA is required');
          JS
      - name: Install test dependencies
        working-directory: site
        run: npm ci
      - name: Install browsers
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Smoke-test the live URL
        working-directory: site
        env:
          SITE_URL: ${{ inputs.url }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/smoke.mjs "$SITE_URL" "$EXPECTED_SHA"
