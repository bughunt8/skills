name: sync-matt-release

# Track the pinned Matt Pocock release as a single audited unit. The manifest
# sources, the dependency registry, the checker, the docs and the site all move
# together. The workflow targets staging and runs the A0 and S1 gates inside the
# job, because a GITHUB_TOKEN pull request cannot trigger those workflows.

on:
  schedule:
    - cron: '47 4 * * 1' # Mondays 04:47 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: 'Release tag or branch (blank means the latest semver tag)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sync-matt-release
  cancel-in-progress: false

jobs:
  sync:
    name: track the Matt release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out staging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: staging
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: python3 -m pip install --quiet 'PyYAML==6.0.2'

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Check the pinned release
        id: check
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -uo pipefail
          args=()
          if [ -n "${REF:-}" ]; then args+=(--ref "$REF"); fi
          set +e
          python3 scripts/track_matt_release.py --check "${args[@]}" --json > /tmp/matt-check.json
          code=$?
          set -e
          cat /tmp/matt-check.json
          if [ "$code" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 1 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi

      - name: Apply the release
        if: steps.check.outputs.changed == 'true'
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${REF:-}" ]; then args+=(--ref "$REF"); fi
          python3 scripts/track_matt_release.py --write "${args[@]}" --json | tee /tmp/matt-write.json

      # A pull request opened by GITHUB_TOKEN cannot start a0-skills-checks or
      # s1-site-validate, so the job runs the same gates itself.
      - name: Run the A0 and S1 gates
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 scripts/lint_skills.py --self-test
          python3 scripts/lint_skills.py
          python3 scripts/generate_index.py --check
          python3 scripts/sync_vendor.py --validate-manifest
          python3 scripts/audit_third_party.py
          python3 scripts/check_links.py
          python3 scripts/check_solutions.py
          python3 scripts/check_skill_dependencies.py --include-legacy
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 skills/engineering/github-repository-setup/scripts/test_bundle.py
          python3 -m unittest discover -s skills/engineering/spec-driven-development/tests -p 'test_*.py' -v
          python3 -m unittest discover -s skills/engineering/openheart-analysis/tests -p 'test_*.py' -v
          HARNESS_SOURCE_ROOT="$PWD" python3 -m unittest discover -s skills/engineering/agent-harness/tests -p 'test_*.py' -v
          python3 skills/engineering/agent-harness/skills/agent-harness/scripts/harness_manifest_builder.py --check --repo-root .
          python3 site/build.py --check
          python3 site/tests/test_deploy_workflows.py
          python3 site/tests/test_network.py
          python3 site/tests/test_compose.py
          cd site
          npm ci
          npm run lint:html
          npm run lint:secrets
          npx playwright install --with-deps chromium
          npx playwright test --workers=1 --retries=1

      - name: Build the pull request body
        if: steps.check.outputs.changed == 'true'
        id: body
        run: |
          set -euo pipefail
          {
            echo 'body<<PRBODY'
            echo 'Automated Matt Pocock release update.'
            echo
            echo 'The tracker updated the manifest, dependency registry, generated attribution,'
            echo 'docs, site and harness inventories as one unit.'
            echo
            echo '## Tracker result'
            echo
            echo '```json'
            cat /tmp/matt-check.json
            cat /tmp/matt-write.json 2>/dev/null || true
            echo '```'
            echo
            echo '## Gates run in this job'
            echo
            echo 'A pull request opened by `GITHUB_TOKEN` cannot trigger `a0-skills-checks` or'
            echo '`s1-site-validate`, so this job ran the A0 and S1 gate set itself.'
            echo
            echo '## Review'
            echo
            echo '- Read the upstream release diff. Vendored skill bodies change agent behaviour.'
            echo '- Confirm a provider-set, invocation or graph-evidence change was reviewed by a human.'
            echo '- `PROVENANCE.md`, `ATTRIBUTION.md`, `LICENSE.upstream` and `THIRD_PARTY_NOTICES.md`'
            echo '  are generated, not hand-edited.'
            echo
            echo 'Generated by `.github/workflows/sync-matt-release.yml`.'
            echo 'PRBODY'
          } >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          branch: automation/sync-matt-release
          base: staging
          delete-branch: true
          commit-message: 'chore(vendor): update the Matt Pocock release'
          title: 'chore(vendor): update the Matt Pocock release'
          body: ${{ steps.body.outputs.body }}
          add-paths: |
            skills/
            docs/
            .agents/
            README.md
            AGENTS.md
            THIRD_PARTY_NOTICES.md
            site/index.html
            site/data.js
            site/intro.html
            site/tests/library-size.mjs
