name: Site deploy

# One deploy path, used unchanged by both staging and production.
#
# Staging and production are the SAME setup: same workflow, same steps, same
# secret names, both publishing to AWS S3 + CloudFront and to Hostinger over FTP.
# The only difference is which values those names carry, which comes from the
# GitHub Environment named by the `environment` input. That is what makes the two
# genuinely identical rather than merely similar: there is no second code path
# that can drift, and a staging deploy exercises the exact mechanism production
# will use.
#
# Deliberately mirrors the existing estate rather than inventing a new pattern:
#   AWS steps        follow bughunt8/www-resume .github/workflows/deploy.yml
#   Hostinger step   follows bughunt8/profitrise-website deploy-production.yml
#
# DNS is not managed here, exactly as in www-resume. The record for the
# environment's hostname is created once by hand. See site/DEPLOYMENT.md.

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub Environment supplying the deploy secrets"
        required: true
        type: string
      url:
        description: "Public URL to smoke-test after deploying"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: publish to AWS and Hostinger
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    steps:
      - uses: actions/checkout@v4

      # Fail on a missing secret rather than half-deploying. A deploy that skips
      # one of its two targets and still reports success leaves the two out of
      # sync with nothing to indicate it.
      - name: Confirm the environment is fully configured
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          CF_DIST: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=""
          for name in AWS_KEY AWS_SECRET AWS_REGION S3_BUCKET CF_DIST \
                      FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::environment '${{ inputs.environment }}' is missing:$missing"
            echo "See site/DEPLOYMENT.md. The values are the same ones already held by"
            echo "bughunt8/www-resume (AWS) and bughunt8/profitrise-website (FTP)."
            exit 1
          fi
          echo "environment '${{ inputs.environment }}' is fully configured"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Rebuild rather than trusting the committed page, then refuse to ship if
      # the result differs from what was reviewed. What goes live is what CI
      # produced from the sources.
      - name: Build from source
        working-directory: site
        run: python3 build.py --write

      - name: Refuse to ship a page that is not what the sources produce
        working-directory: site
        run: |
          if ! git diff --quiet -- index.html data.js; then
            echo "::error::site/index.html or site/data.js differs from a clean build."
            echo "Run: cd site && python3 build.py --write"
            git --no-pager diff --stat -- index.html data.js
            exit 1
          fi
          echo "committed page matches a clean build"

      # Stage only publishable files. Keeping tests, the build script, the
      # source manifest and node tooling out of a public bucket is the whole
      # point of assembling a directory rather than syncing the folder.
      - name: Assemble the publish directory
        working-directory: site
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '_site' \
            --exclude 'tests' \
            --exclude 'scripts' \
            --exclude 'node_modules' \
            --exclude 'playwright-report' \
            --exclude 'test-results' \
            --exclude 'build.py' \
            --exclude 'generate_schema.py' \
            --exclude 'sources.json' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'playwright.config.js' \
            --exclude '.htmlvalidate.json' \
            --exclude '_headers' \
            --exclude '*.md' \
            ./ _site/

          printf '%s\n' \
            "$ENVIRONMENT" \
            "commit: ${GITHUB_SHA}" \
            "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/BUILD-INFO.txt

          # Staging must never compete with production in search results.
          if [ "$ENVIRONMENT" = "production" ]; then
            printf 'User-agent: *\nAllow: /\nSitemap: https://skills.ronald.ng/sitemap.xml\n' > _site/robots.txt
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' \
              '  <url><loc>https://skills.ronald.ng/</loc>' \
              "    <lastmod>$(date -u +%Y-%m-%d)</lastmod>" \
              '    <changefreq>weekly</changefreq></url>' \
              '</urlset>' > _site/sitemap.xml
          else
            printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          fi

          echo "publishing:"
          find _site -type f | sort | sed 's/^/  /'

      # Absolute asset paths work locally and 404 under a subpath, so catch them
      # before they are the live site.
      - name: Reject absolute asset paths
        working-directory: site
        run: |
          if grep -nE '(src|href)="/(styles|app|data)' _site/index.html; then
            echo "::error::absolute asset path found; use ./ instead"
            exit 1
          fi
          echo "asset paths are relative"

      # ---------------------------------------------------------------- AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Two passes, matching www-resume: assets get a long cache, HTML gets none,
      # so a content change is visible immediately while assets stay cacheable.
      #
      # SAFETY: --delete makes the destination match the publish directory. It is
      # therefore scoped to S3_PREFIX when one is set, so staging and production
      # can share a bucket without either deleting the other. Point S3_BUCKET at a
      # bucket (or prefix) that holds nothing but this site.
      - name: Sync assets to S3, long cache
        working-directory: site
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_PREFIX: ${{ vars.SITE_S3_PREFIX }}
        run: |
          dest="s3://${S3_BUCKET}${S3_PREFIX:+/${S3_PREFIX#/}}"
          echo "destination: $dest"
          aws s3 sync _site/ "$dest" \
            --delete \
            --exclude "*.html" \
            --exclude "BUILD-INFO.txt" \
            --cache-control "public, max-age=604800, must-revalidate"

      - name: Sync HTML to S3, no cache
        working-directory: site
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_PREFIX: ${{ vars.SITE_S3_PREFIX }}
        run: |
          dest="s3://${S3_BUCKET}${S3_PREFIX:+/${S3_PREFIX#/}}"
          aws s3 sync _site/ "$dest" \
            --exclude "*" --include "*.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public, max-age=0, must-revalidate"
          aws s3 cp _site/BUILD-INFO.txt "$dest/BUILD-INFO.txt" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "no-store"

      - name: Invalidate CloudFront
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          S3_PREFIX: ${{ vars.SITE_S3_PREFIX }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/${S3_PREFIX:+${S3_PREFIX#/}/}*"

      # ---------------------------------------------------------- Hostinger
      # Same artifact, second target. dangerous-clean-slate stays false: it wipes
      # the remote directory, and this account serves other sites.
      - name: Deploy to Hostinger over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./site/_site/
          server-dir: ${{ vars.SITE_FTP_REMOTE_DIR || './' }}
          dangerous-clean-slate: false

  verify:
    name: verify the deployment is live and correct
    needs: deploy
    if: inputs.url != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install test dependencies
        working-directory: site
        run: npm ci
      - name: Install browsers
        working-directory: site
        run: npx playwright install --with-deps chromium

      # A deploy step that succeeds while serving a stale or broken page is a
      # failed deploy. This checks the real origin over the real network, and
      # confirms BUILD-INFO names this commit so a cached previous deploy is
      # detected rather than mistaken for success.
      - name: Smoke-test the live URL
        working-directory: site
        run: node scripts/smoke.mjs "${{ inputs.url }}" "$GITHUB_SHA"
