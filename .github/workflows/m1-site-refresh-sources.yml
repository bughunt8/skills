name: M1 site refresh upstream sources

# The library indexes three repositories that keep changing. This rebuilds the
# page from them on a schedule and opens a pull request when the result differs,
# so new skills appear without anyone remembering to look.
#
# Cadence note: this runs on the 1st and 15th, not on an even-ISO-week gate. An
# even-week gate looks like a fortnight but silently produces a 21-day gap
# whenever a year contains 53 ISO weeks. Day-of-month caps the gap at 16 days.
#
# Credentials: none beyond the automatic GITHUB_TOKEN, which is scoped to this
# repository and cannot deploy anything. The PR targets staging, not main, so an
# upstream change reaches production only through the normal promotion, and it
# still has to be reviewed like any other change. A pull request opened by
# GITHUB_TOKEN cannot trigger the ci workflow, so this job runs the same gates
# itself, before the pull request is opened, as sync-vendored-skills.yml does.

on:
  schedule:
    - cron: "0 6 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: site-refresh-sources
  cancel-in-progress: false

jobs:
  refresh:
    name: rebuild from upstream and open a PR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The repository checks below need PyYAML, exactly as a0-skills-checks
      # installs it, so lint_skills.py parses real YAML instead of refusing it.
      - name: Install PyYAML
        run: python3 -m pip install --quiet 'PyYAML==6.0.2'

      # --refresh clones each source in sources.json at its current tip rather
      # than reusing anything cached, so the rebuild reflects upstream today.
      # pipefail is load-bearing: --refresh moves the pins in sources.json
      # before later collection steps can fail, and without it tee's exit
      # status masks the failure and a half-refreshed tree reports "no changes".
      - name: Rebuild from the upstream repositories
        id: rebuild
        run: |
          set -euo pipefail
          python3 build.py --refresh --write | tee /tmp/build.log
          if git diff --quiet -- index.html data.js sources.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no upstream changes"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- index.html data.js sources.json
          fi

      # The same gates a pull request to staging would run. They run here
      # because a pull request opened by GITHUB_TOKEN cannot start ci, so this
      # is the only place the result is real. A failure here stops the pull
      # request being opened.
      - name: Run the repository checks
        if: steps.rebuild.outputs.changed == 'true'
        working-directory: .
        run: |
          set -euo pipefail
          python3 scripts/lint_skills.py --self-test
          python3 scripts/lint_skills.py
          python3 scripts/generate_index.py --check
          python3 scripts/sync_vendor.py --validate-manifest
          python3 scripts/audit_third_party.py
          python3 scripts/check_links.py
          python3 scripts/check_solutions.py

      # The reproducibility gate from s1-site-validate, against the new pins:
      # it re-clones every source at the pin --refresh just wrote and proves
      # the committed page is the one those pins produce.
      - name: Verify the build is reproducible from the new pins
        if: steps.rebuild.outputs.changed == 'true'
        working-directory: .
        run: |
          set -euo pipefail
          python3 site/build.py --check

      - name: Record what moved
        if: steps.rebuild.outputs.changed == 'true'
        run: |
          {
            echo "Rebuilt from the upstream repositories listed in \`sources.json\`."
            echo
            echo '```'
            cat /tmp/build.log
            echo '```'
            echo
            echo "### Skills added"
            git diff -- index.html | grep -oP '(?<=^\+ +<h3>)[^<]+' | sed 's/^/- /' | sort -u || echo "- none"
            echo
            echo "### Skills removed"
            git diff -- index.html | grep -oP '(?<=^- +<h3>)[^<]+' | sed 's/^/- /' | sort -u || echo "- none"
            echo
            echo "Counts, attribution and licences are regenerated from the source trees, so"
            echo "the figures on the page cannot drift from what is actually in them."
            echo
            echo "A pull request opened by \`GITHUB_TOKEN\` cannot trigger the \`ci\`"
            echo "workflow, so these ran in this job and passed before it was opened:"
            echo "the repository checks, and build reproducibility against the new pins."
          } > /tmp/pr-body.md
          cat /tmp/pr-body.md

      - name: Open or update the pull request
        if: steps.rebuild.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/site-refresh-sources
          base: staging
          commit-message: "chore: refresh skill index from upstream sources"
          title: "chore: refresh skill index from upstream sources"
          body-path: /tmp/pr-body.md
          labels: automation, dependencies
          delete-branch: true
          add-paths: |
            site/index.html
            site/data.js
            site/sources.json
