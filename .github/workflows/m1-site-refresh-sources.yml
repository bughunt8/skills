name: M1 site refresh upstream sources

# The library indexes three repositories that keep changing. This rebuilds the
# page from them on a schedule and opens a pull request when the result differs,
# so new skills appear without anyone remembering to look.
#
# Cadence note: this runs on the 1st and 15th, not on an even-ISO-week gate. An
# even-week gate looks like a fortnight but silently produces a 21-day gap
# whenever a year contains 53 ISO weeks. Day-of-month caps the gap at 16 days.
#
# Credentials: none beyond the automatic GITHUB_TOKEN, which is scoped to this
# repository and cannot deploy anything. The PR targets staging, not main, so an
# upstream change reaches production only through the normal promotion, and it
# still has to be reviewed like any other change. A pull request opened by
# GITHUB_TOKEN cannot trigger the ci workflow, so this job runs the same gates
# itself, before the pull request is opened, as sync-vendored-skills.yml does.

on:
  schedule:
    - cron: "0 6 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: site-refresh-sources
  cancel-in-progress: false

jobs:
  refresh:
    name: rebuild from upstream and open a PR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      # --refresh clones each source in sources.json at its current tip rather
      # than reusing anything cached, so the rebuild reflects upstream today.
      # pipefail is load-bearing: --refresh moves the pins in sources.json
      # before later collection steps can fail, and without it tee's exit
      # status masks the failure and a half-refreshed tree reports "no changes".
      - name: Rebuild from the upstream repositories
        id: rebuild
        run: |
          set -euo pipefail
          python3 build.py --refresh --write | tee /tmp/build.log
          if git diff --quiet -- index.html data.js sources.json intro.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no upstream changes"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- index.html data.js sources.json intro.html
          fi

      # The same gates a pull request to staging would run. They run here
      # because a pull request opened by GITHUB_TOKEN cannot start ci, so this
      # is the only place the result is real. A failure here stops the pull
      # request being opened.
      - name: Install PyYAML
        if: steps.rebuild.outputs.changed == 'true'
        working-directory: .
        run: python3 -m pip install --quiet 'PyYAML==6.0.2'

      - name: Run the repository checks
        if: steps.rebuild.outputs.changed == 'true'
        working-directory: .
        run: |
          set -euo pipefail
          python3 scripts/lint_skills.py --self-test
          python3 scripts/lint_skills.py
          python3 scripts/generate_index.py --check
          python3 scripts/sync_vendor.py --validate-manifest
          python3 scripts/audit_third_party.py
          python3 scripts/check_links.py
          python3 scripts/check_solutions.py

      # The reproducibility gate from s1-site-validate, against the new pins:
      # it re-clones every source at the pin --refresh just wrote and proves
      # the committed page is the one those pins produce.
      - name: Verify the build is reproducible from the new pins
        if: steps.rebuild.outputs.changed == 'true'
        working-directory: .
        run: |
          set -euo pipefail
          python3 site/build.py --check

      # S1 checks out its own revision in each job. Mirror its gates here instead:
      # every command sees the candidate left by --refresh, with no second checkout.
      # test_deploy_workflows.py compares these commands, directories and env to S1.
      - name: Scan the tree for credential-shaped material
        if: steps.rebuild.outputs.changed == 'true'
        run: node scripts/check-secrets.mjs

      - name: Scan the full history with gitleaks
        if: steps.rebuild.outputs.changed == 'true'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify index.html matches the pinned sources
        if: steps.rebuild.outputs.changed == 'true'
        run: python3 build.py --check

      - name: Confirm the gate can actually fail
        if: steps.rebuild.outputs.changed == 'true'
        run: |
          # Guard against --check passing vacuously. Plant a card that is in no
          # source repo, prove --check rejects it, restore, prove it passes.
          cp index.html /tmp/index.orig
          sed -i 's#</main>#<article class="card"><h3>planted-defect</h3></article></main>#' index.html
          if python3 build.py --check; then
            echo "::error::build.py --check passed on a corrupted index.html; the gate is vacuous"
            cp /tmp/index.orig index.html
            exit 1
          fi
          echo "gate confirmed: --check rejects a page that disagrees with its sources"
          cp /tmp/index.orig index.html
          python3 build.py --check

      - name: Confirm the count audit can actually fail
        if: steps.rebuild.outputs.changed == 'true'
        run: |
          # Same again for the claim audit: type a false count into the
          # hand-written region and prove the build refuses it.
          cp index.html /tmp/index.orig
          sed -i '0,/<title>/s#<title>[^<]*#<title>The Skill Library, 999 agent skills across 3 categories#' index.html
          if python3 build.py --check; then
            echo "::error::audit_claims passed on a false count; the gate is vacuous"
            cp /tmp/index.orig index.html
            exit 1
          fi
          echo "gate confirmed: a hand-typed count fails the build"
          cp /tmp/index.orig index.html
          python3 build.py --check

      - if: steps.rebuild.outputs.changed == 'true'
        run: npm ci

      - if: steps.rebuild.outputs.changed == 'true'
        run: npm run lint:html

      - name: Install browsers
        if: steps.rebuild.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run the suite
        if: steps.rebuild.outputs.changed == 'true'
        env:
          WORKSPACE_EVIDENCE_DIR: ${{ runner.temp }}/graph-workspace-evidence
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/graph-workspace-evidence/node-suite.json
        run: npm test -- --workers=1 --reporter=github,html,list,json

      - name: Prove workspace search and readability gates reject planted defects
        if: steps.rebuild.outputs.changed == 'true'
        env:
          WORKSPACE_EVIDENCE_DIR: ${{ runner.temp }}/graph-workspace-evidence
        run: node scripts/prove-workspace-defects.mjs

      - name: Prove motion gates reject broken state, invisible labels and no-op animation
        if: steps.rebuild.outputs.changed == 'true'
        env:
          WORKSPACE_EVIDENCE_DIR: ${{ runner.temp }}/graph-workspace-evidence/motion
          SITE_TEST_PORT: 8241
        run: node scripts/prove-motion-defects.mjs

      - name: Smoke-test the actual publish assembly without retired scroll assets
        if: steps.rebuild.outputs.changed == 'true'
        env:
          WORKSPACE_EVIDENCE_DIR: ${{ runner.temp }}/graph-workspace-evidence
        run: node scripts/check-workspace-publish.mjs

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() && steps.rebuild.outputs.changed == 'true' }}
        with:
          name: playwright-report
          path: |
            site/playwright-report/
            site/test-results/
            ${{ runner.temp }}/graph-workspace-evidence/
          retention-days: 14

      - name: Validate solution steps resolve to real skills
        if: steps.rebuild.outputs.changed == 'true'
        working-directory: .
        run: python3 scripts/check_solutions.py

      - name: Unit-test the composition engine
        if: steps.rebuild.outputs.changed == 'true'
        working-directory: site
        run: python3 tests/test_compose.py

      - name: Unit-test the graph, its communities and its geometry
        if: steps.rebuild.outputs.changed == 'true'
        working-directory: site
        run: python3 tests/test_network.py

      - name: Confirm the graph tests can actually fail
        if: steps.rebuild.outputs.changed == 'true'
        working-directory: site
        run: |
          for defect in spacing labels seed; do
            python3 scripts/plant_network_defect.py plant "$defect"
            if python3 tests/test_network.py > "/tmp/planted-$defect.log" 2>&1; then
              echo "::error::the graph tests passed with the '$defect' defect planted"
              python3 scripts/plant_network_defect.py restore
              exit 1
            fi
            echo "gate confirmed: '$defect' fails these tests"
            grep -E "^  FAIL" "/tmp/planted-$defect.log" | head -3 || true
            python3 scripts/plant_network_defect.py restore
          done
          python3 tests/test_network.py

      - name: Confirm the composition tests can actually fail
        if: steps.rebuild.outputs.changed == 'true'
        working-directory: site
        run: |
          python3 scripts/plant_identity_defect.py plant
          if python3 tests/test_compose.py > /tmp/planted.log 2>&1; then
            echo "::error::the composition tests passed with the identity defect planted"
            python3 scripts/plant_identity_defect.py restore
            exit 1
          fi
          echo "gate confirmed: name-keying the graph fails these tests"
          grep -E "^  FAIL" /tmp/planted.log || true
          python3 scripts/plant_identity_defect.py restore
          python3 tests/test_compose.py

      - name: Test workflow contracts and reject planted wiring defects
        if: steps.rebuild.outputs.changed == 'true'
        working-directory: .
        run: python3 site/tests/test_deploy_workflows.py

      - name: Prove the smoke command rejects missing and stale builds
        if: steps.rebuild.outputs.changed == 'true'
        working-directory: site
        run: node scripts/prove-deploy-gate.mjs

      - name: Record what moved
        if: steps.rebuild.outputs.changed == 'true'
        run: |
          {
            echo "Rebuilt from the upstream repositories listed in \`sources.json\`."
            echo
            echo '```'
            cat /tmp/build.log
            echo '```'
            echo
            echo "### Skills added"
            git diff -- index.html | grep -oP '(?<=^\+ +<h3>)[^<]+' | sed 's/^/- /' | sort -u || echo "- none"
            echo
            echo "### Skills removed"
            git diff -- index.html | grep -oP '(?<=^- +<h3>)[^<]+' | sed 's/^/- /' | sort -u || echo "- none"
            echo
            echo "Counts, attribution and licences are regenerated from the source trees, so"
            echo "the figures on the page cannot drift from what is actually in them."
            echo
            echo "### Validation before pull request creation or update"
            echo "These checks passed on the refreshed candidate in this job's workspace:"
            echo "- Repository checks: lint_skills.py --self-test; lint_skills.py; generate_index.py --check; sync_vendor.py --validate-manifest; audit_third_party.py; check_links.py; check_solutions.py."
            echo "- Build reproducibility against the new pins, including planted-page and false-count rejection proofs."
            echo "- Credential-shaped tree scan and full-history gitleaks scan."
            echo "- HTML validity: npm run lint:html."
            echo "- Browser suite: npm test -- --workers=1 --reporter=github,html,list,json."
            echo "- Workspace and motion planted-defect proofs; publish-assembly smoke test."
            echo "- Solution references, composition and graph unit tests, including planted graph and identity defects."
            echo "- Deployment workflow contracts and missing/stale-build smoke rejection proof."
            echo
            echo "The default \`GITHUB_TOKEN\` does not start automatic \`pull_request\` validation."
            echo "This validates the candidate before opening or updating the PR; it does not"
            echo "give the PR required GitHub status contexts. The evidence is this refresh run."
          } > /tmp/pr-body.md
          cat /tmp/pr-body.md

      - name: Open or update the pull request
        if: steps.rebuild.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/site-refresh-sources
          base: staging
          commit-message: "chore: refresh skill index from upstream sources"
          title: "chore: refresh skill index from upstream sources"
          body-path: /tmp/pr-body.md
          labels: automation, dependencies
          delete-branch: true
          add-paths: |
            site/index.html
            site/data.js
            site/sources.json
            site/intro.html
