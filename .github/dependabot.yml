version: 2
updates:
  # Third-party actions are pinned to full commit SHAs, which is correct for security
  # and useless for staying current. Dependabot is what closes that gap: it proposes
  # the new SHA with the release notes attached.
  - package-ecosystem: github-actions
    directory: /
    # Automation pull requests target `staging`, the branch this repository works on
    # and where the validation suite is green. `main` carries the promoted release
    # and is only ever changed by the promotion flow, so a bump opened against it
    # lands on a tree whose generated site artifacts lag its own sources and cannot
    # pass the build-reproducibility gate.
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(actions)'
    labels:
      - automation
      - dependencies
    groups:
      actions:
        patterns:
          - '*'
